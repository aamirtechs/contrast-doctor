[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contrast-doctor"
version = "1.0.0"
description = "Bulk WCAG contrast checker for color palettes and CSS files with concrete fix suggestions"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Amir Hussain" }]
requires-python = ">=3.9"
keywords = ["accessibility", "wcag", "contrast", "css", "color", "cli", "a11y"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

[project.scripts]
contrast-doctor = "contrast_doctor:main"

[project.urls]
Homepage = "https://github.com/aamirtechs/contrast-doctor"
Issues = "https://github.com/aamirtechs/contrast-doctor/issues"

[tool.setuptools]
py-modules = ["contrast_doctor"]
